services:
  nats:
    image: nats:2.14-alpine
    container_name: nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"   # core NATS / JetStream
      - "1883:1883"   # built-in MQTT listener (eKuiper, local MQTT clients)
      - "8222:8222"   # monitoring
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - /opt/iot-edge/data/nats:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- 'http://localhost:8222/healthz?js-enabled-only=true' >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [iot-edge]

  nats-init:
    image: natsio/nats-box:latest
    container_name: nats-init
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [iot-edge]

  mock-inference:
    image: christophe2bu/mock-inference:latest
    container_name: mock-inference
    restart: unless-stopped
    env_file:
      - ./mock-inference/config.env
    volumes:
      - /opt/iot-edge/log/mock-inference:/log
    depends_on:
      nats:
        condition: service_healthy
        restart: true
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "/mock-inference", "--healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [iot-edge]

  ekuiper:
    image: lfedge/ekuiper:latest
    container_name: ekuiper
    hostname: ekuiper
    restart: unless-stopped
    user: root
    ports:
      - "9081:9081"
    environment:
      # eKuiper's default MQTT source now points at the NATS MQTT listener.
      # NATS accepts MQTT 3.1.1 only.
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://nats:1883"
      MQTT_SOURCE__DEFAULT__PROTOCOLVERSION: "3.1.1"
      # QoS 0: messages published by core NATS clients (mock-inference) are
      # always delivered to MQTT subscriptions as QoS 0 by design, so asking
      # for QoS 1 here would only create MQTT session state with no benefit.
      MQTT_SOURCE__DEFAULT__QOS: "0"
      MQTT_SOURCE__DEFAULT__CLIENTID: "ekuiper-inference-sub"
      KUIPER__BASIC__CONSOLELOG: "true"
    volumes:
      - /opt/iot-edge/data/ekuiper:/kuiper/data
      - /opt/iot-edge/log/ekuiper:/kuiper/log
    depends_on:
      nats:
        condition: service_healthy
        restart: true
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9081 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [iot-edge]

  ekuiper-init:
    image: curlimages/curl:latest
    container_name: ekuiper-init
    restart: "no"
    depends_on:
      ekuiper:
        condition: service_started
    volumes:
      - ./ekuiper/init.sh:/init.sh:ro
      - ./ekuiper/stream.json:/config/stream.json:ro
      - ./ekuiper/rule.json:/config/rule.json:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [iot-edge]

  rp-alerts-to-emqx:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: rp-alerts-to-emqx
    restart: unless-stopped
    command: ["run", "/connect.yaml"]
    env_file:
      - ./redpanda-connect/emqx.env
    volumes:
      - ./redpanda-connect/alerts-to-emqx.yaml:/connect.yaml:ro
      # Uncomment if central EMQX uses a private CA and set EMQX_ROOT_CA_FILE
      # in redpanda-connect/emqx.env to /certs/ca.pem.
      # - ./redpanda-connect/certs:/certs:ro
    depends_on:
      nats:
        condition: service_healthy
        restart: true
      nats-init:
        condition: service_completed_successfully
      ekuiper-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:4195/ready >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [iot-edge]

networks:
  iot-edge:
    name: iot-edge
