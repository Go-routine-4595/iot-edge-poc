services:
  # ---------------------------------------------------------------------------
  # NATS: JetStream persistence + built-in MQTT listener.
  # Single messaging owner for the edge: core NATS subjects for internal
  # publishers, MQTT 3.1.1 on 1883 for eKuiper and any local MQTT client.
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.14-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    env_file:
      - /opt/iot-edge/leaf.env
    ports:
      - "4222:4222"   # core NATS / JetStream
      - "1883:1883"   # built-in MQTT listener (eKuiper, local MQTT clients)
      - "8222:8222"   # monitoring
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./nats/server.crt:/etc/nats/certs/server.crt:ro
      - /opt/iot-edge/data/nats:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- 'http://localhost:8222/healthz?js-enabled-only=true' >/dev/null || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # mem_limit: 512m
    networks: [iot-edge]

  # ---------------------------------------------------------------------------
  # One-shot: create/update the INFERENCE and ALERTS JetStream streams.
  # Exits 0 on success. Its retry loop is bounded (see nats/init.sh) so a
  # failure surfaces in the Komodo log within 60s instead of hanging the deploy.
  # ---------------------------------------------------------------------------
  # Version: 0.19.7
  # Release-Date: Jun 2, 2026 at 11:43 am
  nats-init:
    image: natsio/nats-box:latest
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./nats/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [iot-edge]

  mock-inference:
    image: christophe2bu/mock-inference:latest
    restart: unless-stopped
    env_file:
      - ./mock-inference/config.env
    volumes:
      - /opt/iot-edge/log/mock-inference:/log
    depends_on:
      nats:
        condition: service_healthy
        restart: true
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "/mock-inference", "--healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    # mem_limit: 128m
    networks: [iot-edge]

  # Version: v2.4.1-alpine
  # Release-Date: Aug 13, 2026 at 8:24 pm
  ekuiper:
    image: lfedge/ekuiper:latest
    hostname: ekuiper
    restart: unless-stopped
    user: root
    ports:
      - "9081:9081"
    environment:
      # eKuiper's default MQTT source now points at the NATS MQTT listener.
      # NATS accepts MQTT 3.1.1 only.
      MQTT_SOURCE__DEFAULT__SERVER: "tcp://nats:1883"
      MQTT_SOURCE__DEFAULT__PROTOCOLVERSION: "3.1.1"
      # QoS 0: messages published by core NATS clients (mock-inference) are
      # always delivered to MQTT subscriptions as QoS 0 by design, so asking
      # for QoS 1 here would only create MQTT session state with no benefit.
      MQTT_SOURCE__DEFAULT__QOS: "0"
      MQTT_SOURCE__DEFAULT__CLIENTID: "ekuiper-inference-sub"
      KUIPER__BASIC__CONSOLELOG: "true"
    volumes:
      - /opt/iot-edge/data/ekuiper:/kuiper/data
      - /opt/iot-edge/log/ekuiper:/kuiper/log
    depends_on:
      nats:
        condition: service_healthy
        restart: true
      nats-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9081 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # mem_limit: 512m
    networks: [iot-edge]

  # ---------------------------------------------------------------------------
  # One-shot: install the inference_events stream and the create_alert rule.
  # Waits on ekuiper being *healthy* (not merely started), so the bounded retry
  # loop in ekuiper/init.sh is a backstop rather than the primary wait.
  # ---------------------------------------------------------------------------
  # Version curl: 8.22.0
  # Release-Date: 2026-09-02
  ekuiper-init:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      ekuiper:
        condition: service_healthy
    volumes:
      - ./ekuiper/init.sh:/init.sh:ro
      - ./ekuiper/stream.json:/config/stream.json:ro
      - ./ekuiper/rule.json:/config/rule.json:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [iot-edge]

  # Version: 4.107.2
  # Date: 2026-08-31T15:57:15Z
  rp-alerts-to-emqx:
    image: docker.redpanda.com/redpandadata/connect:latest
    restart: unless-stopped
    command: ["run", "/connect.yaml"]
    env_file:
      - ./redpanda-connect/emqx.env
    volumes:
      - ./redpanda-connect/alerts-to-emqx.yaml:/connect.yaml:ro
      # Uncomment if central EMQX uses a private CA and set EMQX_ROOT_CA_FILE
      # in redpanda-connect/emqx.env to /certs/ca.pem.
      # - ./redpanda-connect/certs:/certs:ro
    depends_on:
      nats:
        condition: service_healthy
        restart: true
      nats-init:
        condition: service_completed_successfully
      ekuiper-init:
        condition: service_completed_successfully
    # NOTE: verify this image has /bin/sh AND wget before trusting this check:
    #   docker run --rm --entrypoint sh <image> -c 'which wget || echo NO_WGET'
    # If either is missing the container reports (unhealthy) forever while
    # working fine. Nothing gates on it, so this cannot deadlock the deploy --
    # but delete the block rather than leaving a check that always fails.
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:4195/ready >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # mem_limit: 256m
    networks: [iot-edge]

# Project-scoped network: Compose names it <project>_iot-edge, so a leftover
# stack can never contend for it and `docker compose down` actually removes it.
# Service-to-service DNS (nats, ekuiper) is unaffected -- it resolves by
# service name, not container name.
networks:
  iot-edge: {}
