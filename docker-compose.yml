# Copper Sentinel — IoT Edge PoC
# Branch: feature/bloblang-rules
#
# Variant: Redpanda Connect (Bloblang) as rules engine
# Compare with main branch which uses eKuiper.
#
# Changes from main:
#   REMOVED:  ekuiper, ekuiper-init
#   ADDED:    rp-rules-engine (Redpanda Connect + Bloblang pipeline)
#   UNCHANGED: nats, nats-init, nanomq, mock-inference,
#              rp-inference-to-mqtt, rp-alerts-to-jetstream, rp-alerts-to-emqx
#
# Data flow:
#   mock-inference
#     → NATS JetStream (INFERENCE stream)
#     → rp-inference-to-mqtt
#     → NanoMQ (videoai/inference/events)
#     → rp-rules-engine          ← Redpanda Connect / Bloblang
#     → NanoMQ (videoai/alerts/generated)
#     → rp-alerts-to-jetstream
#     → NATS JetStream (videoai.alerts)
#     → rp-alerts-to-emqx
#     → EMQX (cloud)

services:

  # ── Infrastructure ──

  nats:
    image: nats:latest
    container_name: nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - /opt/iot-edge/data/nats:/data
    networks: [iot-edge]

  nats-init:
    image: natsio/nats-box:latest
    container_name: nats-init
    restart: "no"
    depends_on:
      - nats
    volumes:
      - ./nats/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    networks: [iot-edge]

  nanomq:
    image: emqx/nanomq:latest
    container_name: nanomq
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./nanomq/nanomq.conf:/etc/nanomq.conf:ro
    networks: [iot-edge]

  # ── Inference (mock) ──

  mock-inference:
    image: christophe2bu/mock-inference:latest
    container_name: mock-inference
    restart: unless-stopped
    env_file:
      - ./mock-inference/config.env
    volumes:
      - /opt/iot-edge/log/mock-inference:/log
    depends_on:
      nats-init:
        condition: service_completed_successfully
    networks: [iot-edge]

  # ── Redpanda Connect: JetStream → NanoMQ bridge (unchanged) ──

  rp-inference-to-mqtt:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: rp-inference-to-mqtt
    restart: unless-stopped
    command: ["run", "/connect.yaml"]
    volumes:
      - ./redpanda-connect/inference-to-mqtt.yaml:/connect.yaml:ro
    depends_on:
      nats-init:
        condition: service_completed_successfully
      nanomq:
        condition: service_started
    networks: [iot-edge]

  # ── Rules Engine: Redpanda Connect / Bloblang ──
  # Replaces eKuiper. Reads from NanoMQ, applies business rules, publishes alerts.
  # To change a rule: edit redpanda-connect/rp-rules-engine.yaml and restart this container.
  # No image rebuild required.

  rp-rules-engine:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: rp-rules-engine
    restart: unless-stopped
    command: ["run", "/connect.yaml"]
    volumes:
      - ./redpanda-connect/rp-rules-engine.yaml:/connect.yaml:ro
    depends_on:
      nanomq:
        condition: service_started
      rp-inference-to-mqtt:
        condition: service_started
    networks: [iot-edge]

  # ── Redpanda Connect: NanoMQ → JetStream + EMQX bridges (unchanged) ──

  rp-alerts-to-jetstream:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: rp-alerts-to-jetstream
    restart: unless-stopped
    command: ["run", "/connect.yaml"]
    volumes:
      - ./redpanda-connect/alerts-to-jetstream.yaml:/connect.yaml:ro
    depends_on:
      nats-init:
        condition: service_completed_successfully
      rp-rules-engine:
        condition: service_started
    networks: [iot-edge]

  rp-alerts-to-emqx:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: rp-alerts-to-emqx
    restart: unless-stopped
    command: ["run", "/connect.yaml"]
    env_file:
      - ./redpanda-connect/emqx.env
    volumes:
      - ./redpanda-connect/alerts-to-emqx.yaml:/connect.yaml:ro
    depends_on:
      nats-init:
        condition: service_completed_successfully
      rp-alerts-to-jetstream:
        condition: service_started
    networks: [iot-edge]

networks:
  iot-edge:
    name: iot-edge
