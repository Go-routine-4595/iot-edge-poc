# the domain must be unique across every server that can reach every other server over leaf links — all edges plus
# the central NATS. Simplest convention is to set it equal to server_name
server_name: edge-nats-chris
host: 0.0.0.0
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  domain: edge-nats-chris        #doamin name no dot!
  max_memory_store: 128M
  max_file_store: 1G
}

accounts {
  # everything local lives here and is completely unchanged
  # $G is the implicit default account every client lands in when no user/
  # credentials are given
  "$G": {
    jetstream: enabled
    exports: [ { stream: "videoai.>" } ]
  }

  # exists only to carry traffic up the leaf link, with a device prefix
  UPLINK: {
    imports: [
      { stream: { account: "$G", subject: "videoai.>" }, prefix: edge-nats-chris } #$EDGE_PREFIX
    ]
  }
}

leafnodes {
  remotes = [
    {
      account: UPLINK
      url: $LEAF_URL
      tls {
        ca_file: "/etc/nats/certs/server.crt"
        timeout: 5
      }
    }
  ]
}

# Built-in MQTT listener (NATS Server >= 2.2).
#
# JetStream above is a hard requirement for this block: MQTT session state,
# QoS 1/2 delivery tracking and retained messages are persisted by the server
# in the internal $MQTT_msgs / $MQTT_sess / $MQTT_rmsgs streams.
#
# Only MQTT 3.1.1 is accepted. A client that offers MQTT 5.0 is rejected with
# CONNACK return code 1 (unacceptable protocol version).
#
# Topic <-> subject mapping is a straight '/' <-> '.' substitution:
#   MQTT  videoai/inference/events   ==   NATS  videoai.inference.events
#   MQTT  videoai/alerts             ==   NATS  videoai.alerts
#
# This is what lets eKuiper talk plain MQTT while the rest of the edge stack
# stays on NATS/JetStream subjects, with no broker or adapter in between.
mqtt {
  port: 1883

  # Time the server waits for a PUBACK before redelivering a QoS 1 message.
  ack_wait: 30s

  # Maximum QoS 1/2 messages in flight per MQTT subscription.
  max_ack_pending: 128
}
