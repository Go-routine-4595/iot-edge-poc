listeners.tcp {
  bind = "0.0.0.0:1883"
}

# Local NanoMQ -> central EMQX bridge connection.
#
# IMPORTANT:
# This bridge is intentionally NOT used for durable outbound alerts.
# JetStream remains the only persistence owner for pending WAN messages.
# Reliable alerts use:
#   JetStream ALERTS -> Redpanda Connect -> backend.christophe.engineering:8883
#
# This NanoMQ bridge can be used for inbound commands/configuration or
# non-durable local MQTT traffic once topic mappings are defined.
bridges.mqtt.backend {
  server = "mqtt-tcp://backend.christophe.engineering:1883"
  proto_ver = 4
  clientid = "iot-edge-nanomq-bridge"
  clean_start = true
  keepalive = 60s

  # Uncomment if the backend requires username/password authentication.
  # username = "..."
  # password = "..."

  # No outbound/inbound topic mappings are enabled yet on purpose.
  # Add only topics that do not require JetStream-owned WAN persistence.
  forwards = [
    {
      local_topic = "test/nanomq"
      remote_topic = "test/nanomq"
      qos = 0
    }
  ]
  subscription = [
    {
      remote_topic = "test/command"
      local_topic  = "test/command"
      qos = 0
    }
  ]

  # If backend.christophe.engineering uses a private CA or mTLS,
  # mount the certificate files into the NanoMQ container and enable:
  #
  # ssl {
  #   cacertfile = "/etc/nanomq/certs/ca.pem"
  #   certfile   = "/etc/nanomq/certs/client.pem"
  #   keyfile    = "/etc/nanomq/certs/client.key"
  # }

  max_parallel_processes = 2
  max_send_queue_len = 128
  max_recv_queue_len = 128
}

# Do not configure NanoMQ SQLite/bridge disk caching.
# JetStream is the single persistence layer for the edge architecture.

log {
  to = [console]
  level = info
}
